name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy assets into www
        run: |
          mkdir -p www
          cp -r assets www/assets

      - name: Add Android platform
        run: npx cap add android

      - name: Apply launcher icons and portrait orientation
        run: |
          SRC=android-icons/play-store-icon-512.png
          if [ ! -f "$SRC" ]; then
            echo "::error::$SRC bulunamadi. 512x512 PNG ikonu android-icons/ klasorune yukleyin."
            exit 1
          fi
          command -v convert >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y imagemagick; }
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}
            s=${pair##*:}
            OUT=android/app/src/main/res/mipmap-$d
            convert "$SRC" -filter Lanczos -resize ${s}x${s} "PNG32:$OUT/ic_launcher.png"
            cp "$OUT/ic_launcher.png" "$OUT/ic_launcher_round.png"
            rm -f "$OUT/ic_launcher_foreground.png"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Match and Order.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Match and Order-apk
          path: Match and Order.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: Match and Order.apk
