function toast(s){const t=$("ts");t.textContent=s;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
const ic=t=>t.gen?GEN[t.gen].e:CH[t.ch][t.lv];
const NM={A:["dough","halfofbread","bread","sandwich","taco","wrap","sliceofpizza","hamburger"],B:["seashell","shrimp","crab","lobster","fish"],C:["milkshake","bubbletea","coffee","tea"],D:["pie","cupcake","cakeslice","birthdaycake"],E:["icecreamcornet","onescoopinacup","triplescoopinacup"],F:["hotdog","chickendrumstick","meatonthebone","cutofmeat"]};
const GN={G1:"fastfood",G2:"seafood",G3:"drinks",G4:"dessert",G5:"icecream",G6:"grill"};
const MISS=new Set();
const pic=(n,e)=>MISS.has(n)?e:`<img class="tl" src="assets/tiles/${n}.png" alt="" draggable="false" onerror="MISS.add('${n}');this.replaceWith(document.createTextNode('${e}'))">`;
const ih=t=>t.gen?pic(GN[t.gen],GEN[t.gen].e):pic(NM[t.ch][t.lv],CH[t.ch][t.lv]);
const tl=(ch,lv)=>pic(NM[ch][lv],CH[ch][lv]);
/* ---- Mutfak: birleştirme + müşteriler ---- */
const fc=()=>{const u=cust.map(c=>c.f),r=FA.filter(f=>!u.includes(f));return(r.length?r:FA)[rnd(r.length||4)]};
function mk(){const n=nd(),K=Object.keys(CH),ch=K[rnd(K.length)],lv=1+rnd(Math.min(2+Math.min(2,n),CH[ch].length-1));return{f:fc(),ch,lv,coin:Math.round((15+lv*20)*(1+.1*n))}}
function drawK(){
 while(cust.length<4)cust.push(mk());
 $("bd").innerHTML="";
 g.forEach((t,i)=>{const d=document.createElement("div");d.className="c"+(i==sel?" sel":"")+(t&&t.gen?" gen":"");
  if(t)d.innerHTML="<span>"+ih(t)+"</span>"+(t.gen?"":"<i class='lv'>"+(t.lv+1)+"</i>");
  d.dataset.i=i;d.onpointerdown=e=>{drag={i,x:e.clientX,y:e.clientY,on:false};if(t&&!t.gen)$("gh").innerHTML=ih(t)};$("bd").appendChild(d)});
 const orb=$("or"),sl=orb.scrollLeft;orb.innerHTML=cust.map((o,i)=>{const has=g.some(t=>t&&t.ch==o.ch&&t.lv==o.lv);
  return `<div class="o"><div class="fc"><img src="${o.f}" alt=""></div><div class="it">${tl(o.ch,o.lv)}</div>🪙${o.coin}<button class="${has?"ok":""}" onclick="deliver(${i})">${has?"Teslim et":"Eksik"}</button></div>`}).join("");
 orb.scrollLeft=sl;$("en").textContent=S.en;$("co").textContent=S.coin;save()}
function deliver(i){const o=cust[i],k=g.findIndex(t=>t&&t.ch==o.ch&&t.lv==o.lv);
 if(k<0){sayH("Panoda "+tl(o.ch,o.lv)+" yok. Aynı seviyeleri birleştir.");return}
 g[k]=null;S.coin+=o.coin;cust.splice(i,1);cust.splice(i,0,mk());say("Sipariş teslim edildi: +"+o.coin+" jeton. Haritada harca!");drawK()}
function spawn(i){const f=g.map((x,k)=>x?-1:k).filter(k=>k>=0);
 if(!f.length){say("Hücreler doldu! Yeni ürün eklenemez, birleştirerek yer aç.");toast("Hücreler doldu!");return}
 if(S.en<1){say("Enerjin bitti.");return}
 S.en--;g[f[rnd(f.length)]]={ch:GEN[g[i].gen].ch,lv:rnd(4)?0:1};drawK()}
function drop(a,b){if(a==b)return;const x=g[a],y=g[b];if(!x||x.gen)return;
 if(!y){g[b]=x;g[a]=null}
 else if(!y.gen&&x.ch==y.ch&&x.lv==y.lv&&x.lv<CH[x.ch].length-1){g[b]={ch:x.ch,lv:x.lv+1};g[a]=null;snd("match");sayH("Birleşti: "+tl(x.ch,x.lv+1))}
 else if(!y.gen){g[a]=y;g[b]=x}
 drawK()}
function tap(i){const t=g[i];
 if(sel>=0&&sel!=i){const s=sel;sel=-1;drop(s,i);return}
 if(!t){sel=-1;drawK();return}
 if(t.gen){sel=-1;spawn(i);return}
 sel=i;sayH(CH[t.ch].map((e,k)=>k==t.lv?"<b class='cur'>"+tl(t.ch,k)+"</b>":tl(t.ch,k)).join("→")+"  ·  seviye "+(t.lv+1)+"/"+CH[t.ch].length);drawK()}
let drag=null;
addEventListener("pointermove",e=>{if(!drag)return;const t=g[drag.i];
 if(!drag.on&&t&&!t.gen&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.on=true;$("gh").hidden=false}
 if(drag.on){$("gh").style.left=e.clientX+"px";$("gh").style.top=e.clientY+"px"}});
addEventListener("pointerup",e=>{if(!drag)return;const d=drag;drag=null;$("gh").hidden=true;
 if(d.on){const c=document.elementFromPoint(e.clientX,e.clientY)?.closest(".c");sel=-1;if(c)drop(d.i,+c.dataset.i);else drawK()}else tap(d.i)});
addEventListener("pointercancel",()=>{drag=null;$("gh").hidden=true});
setInterval(()=>{if(S.en<50){S.en++;$("en").textContent=S.en;save()}},8000);
/* ---- Harita: restorasyon ---- */
function drawM(){
 $("map").querySelectorAll(".hs").forEach(e=>e.remove());
 A.forEach((a,i)=>{const b=document.createElement("button"),d=S.done[i],L=len(i),lk=!open(i);
  b.className="hs"+(lk?" lock":d>=L?" ok":"");b.style.left=a.x+"%";b.style.top=a.y+"%";
  b.textContent=(lk?"🔒 ":d>=L?"✅ ":"")+a.n+(lk||d>=L?"":" "+d+"/"+L);
  b.onclick=()=>lk?toast("Önce "+A[i-1].n+" bölgesini tamamla."):openA(i);$("map").appendChild(b)});
 $("chips").innerHTML=A.map((a,i)=>`<button onclick="go(${i})">${a.n}</button>`).join("");
 if($("md").hidden)setMap(false)}
let mapK=0;
const mapLv=()=>{let k=0;while(k<A.length&&S.done[k]>=len(k))k++;return k};
function setMap(anim){const k=mapLv();if(k==mapK)return;const bm=$("bm"),bx=$("bx");mapK=k;
 if(MP[k+1])new Image().src=MP[k+1];
 if(!anim){bm.src=MP[k];return}
 bx.style.transition="none";bx.style.opacity=0;bx.src=MP[k];
 (bx.decode?bx.decode():Promise.resolve()).catch(()=>{}).then(()=>requestAnimationFrame(()=>{bx.style.transition="";bx.style.opacity=1;
  setTimeout(()=>{if(mapK!=k)return;bm.src=MP[k];(bm.decode?bm.decode():Promise.resolve()).catch(()=>{}).then(()=>{bx.style.transition="none";bx.style.opacity=0})},1500)}))}
function go(i){const m=$("map"),w=$("mw"),a=A[i];
 w.scrollTo({left:a.x/100*m.offsetWidth-w.clientWidth/2,top:a.y/100*m.offsetHeight-w.clientHeight/2,behavior:"smooth"})}
function stg(d,fade){const mi=$("mi"),mr=$("mr"),im=IM[cur];
 if(!fade){mi.src=mr.src=im[d];mr.style.transition="none";mr.style.opacity=1;return}
 mi.src=im[d-1];mr.style.transition="none";mr.style.opacity=0;mr.src=im[d];
 (mr.decode?mr.decode():Promise.resolve()).catch(()=>{}).then(()=>requestAnimationFrame(()=>{mr.style.transition="opacity .9s";mr.style.opacity=1}))}
function openA(i){cur=i;const st=IM[i].length>1;$("mv").className=st?"st":"";
 if(st)stg(S.done[i],false);else{$("mi").src=$("mr").src=IM[i][0];$("mr").style.transition="";$("mr").style.opacity=1}
 $("md").hidden=false;rA();save()}
function rA(){const a=A[cur],d=S.done[cur],L=len(cur),p=d/L;
 if(IM[cur].length<2){for(let k=0;k<4;k++)$("mr").style.setProperty("--r"+k,(d>=L?200:d>k?55:0)+"%");$("gl").style.opacity=d>=L?1:p*.8}
 $("mt").textContent=a.n+(d>=L?" ✅":"");$("mbar").style.width=p*100+"%";
 $("tk").innerHTML=a.t.map((s,k)=>{const [ty,lb]=s.split(":"),t=TY[ty];
  return `<div class="t"><span>${d>k?"✅":t[0]}</span><span>${lb}</span>${d>k?"":`<button ${d==k?"":"disabled"} onclick="doT(${k})">${t[1]} 🪙${cost(cur,k)}</button>`}</div>`}).join("")}
const ZN=[[50,62],[27,48],[73,58],[50,30]],FX={c:["💨","✨"],o:["🔩","⚙️","✨"],y:["✨","🌟","💡"]};
function burst(a,ty,k,all){const f=$("fx"),s=FX[ty],z=a.z||ZN,[zx,zy]=z[k%z.length],sh=document.createElement("i");
 sh.className="sh";f.appendChild(sh);setTimeout(()=>sh.remove(),1100);
 for(let i=0;i<(all?26:10);i++){const p=document.createElement("span");p.className="p";p.textContent=s[rnd(s.length)];
  p.style.left=(all?5+rnd(90):zx-15+rnd(30))+"%";p.style.top=(all?10+rnd(80):zy-12+rnd(24))+"%";p.style.animationDelay=rnd(400)+"ms";
  f.appendChild(p);setTimeout(()=>p.remove(),1800)}}
function doT(k){const c=cost(cur,k),L=len(cur);if(S.done[cur]!=k)return;
 if(S.coin<c){toast("Yetersiz jeton. Mutfakta sipariş teslim et.");return}
 S.coin-=c;S.done[cur]++;const d=S.done[cur];
 if(d>=L)toast(cur<A.length-1?"Bölge tamamlandı! "+A[cur+1].n+" açıldı, yeni müşteriler geldi.":"Tüm bölgeler restore edildi! 🎉");
 drawK();rA();drawM();if(IM[cur].length>1)stg(d,true);burst(A[cur],A[cur].t[k][0],k,d>=L)}
$("md").onclick=e=>{if(e.target.id=="md"||e.target.classList.contains("x")){$("md").hidden=true;setMap(true);save()}};
function show(s){scr=s;save();$("sk").hidden=s!="k";$("sh").hidden=s!="h";$("nk").className=s=="k"?"on":"";$("nh").className=s=="h"?"on":"";
 if(s=="h"){drawM();const n=S.done.findIndex((d,i)=>d<len(i));setTimeout(()=>go(n<0?0:n),50)}}
/* ---- Sesler ---- */
const SN={},snd=(n,l)=>{try{const a=SN[n]||(SN[n]=new Audio("assets/"+n+".mp3"));a.loop=!!l;a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}},nosnd=n=>{try{SN[n]&&SN[n].pause()}catch(e){}};
/* ---- Açılış ekranı + günlük ödül çarkı ---- */
const PZ=[["e",25,"e",10],["c",75,"c",5],["e",100,"e",15],["c",25,"c",10],["e",75,"e",5],["c",100,"c",15],["e",50,"e",20],["c",50,"c",20]];
const day=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()},pz=(t,n)=>(t=="c"?"🪙":"⚡")+n;
let started=false,spinning=false;
function openD(){const w=$("wd"),b=$("drb");$("dr").hidden=false;$("drt").textContent="";b.disabled=false;b.textContent="Ödülü Al";w.style.transition="none";w.style.transform="none"}
function chkD(){if(started&&$("dr").hidden&&S.dr!=day())openD()}
function spin(){if(spinning||S.dr==day())return;spinning=true;
 const k=rnd(8),p=PZ[k],w=$("wd"),b=$("drb");S.dr=day();
 [[p[0],p[1]],[p[2],p[3]]].forEach(([t,n])=>{if(t=="c")S.coin+=n;else S.en+=n});drawK();
 w.style.transition="none";w.style.transform="rotate(0deg)";void w.offsetWidth;
 b.disabled=true;b.textContent="Çark dönüyor…";$("drt").textContent="";snd("cark",true);
 w.style.transition="transform 5s cubic-bezier(.12,.55,.1,1)";w.style.transform="rotate("+(1800+360-(22.5+45*k)-(rnd(21)-10))+"deg)";
 setTimeout(()=>{nosnd("cark");snd("reward");spinning=false;$("drt").textContent="Kazandın: "+pz(p[0],p[1])+" + "+pz(p[2],p[3]);b.disabled=false;b.textContent="Yarın yine gel"},5200)}
$("drb").onclick=()=>{if(S.dr==day()&&!spinning){$("dr").hidden=true;chkD()}else spin()};
$("spb").onclick=()=>{started=true;$("sp").hidden=true;["cark","reward","match"].forEach(n=>{try{const a=SN[n]||(SN[n]=new Audio("assets/"+n+".mp3"));a.preload="auto";a.load()}catch(e){}});chkD()};
setInterval(chkD,10000);
addEventListener("visibilitychange",()=>{if(document.hidden){save();nosnd("cark")}else chkD()});addEventListener("pagehide",save);
drawK();setMap(false);
if(scr=="h")show("h");if(S.mo>=0&&S.mo<A.length&&open(S.mo))openA(S.mo);
</script></body></html>
